services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_match
      POSTGRES_USER: payment_match
      POSTGRES_PASSWORD: payment_match
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_match -d payment_match"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://payment_match:payment_match@db:5432/payment_match
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

