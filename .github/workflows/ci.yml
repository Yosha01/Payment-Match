name: Tests

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: |
          curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://localhost:8000/
          curl --fail -F file=@examples/invoices.csv http://localhost:8000/api/imports/invoices
          curl --fail -F file=@examples/payments.csv http://localhost:8000/api/imports/payments
          curl --fail http://localhost:8000/api/reconciliation
      - if: always()
        run: docker compose down --volumes

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payment_match_test
          POSTGRES_USER: payment_match
          POSTGRES_PASSWORD: payment_match
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment_match -d payment_match_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://payment_match:payment_match@127.0.0.1:5432/payment_match_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
